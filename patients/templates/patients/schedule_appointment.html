{% extends "base.html" %}
{% block title %}Schedule Appointment{% endblock %}
{% block content %}
<h2>Schedule Appointment</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-group"><label>Patient:</label>{{ form.patient }}</div>
    <div class="form-group"><label>Doctor Name:</label>{{ form.doctor_name }}</div>
    <div class="form-group"><label>Date:</label>{{ form.date }}</div>
    <div class="form-group"><label>Time:</label>{{ form.time }}</div>
    <div class="form-group"><label>Reason:</label>{{ form.reason }}</div>
    <button type="submit">Schedule</button>
</form>
{% endblock %}

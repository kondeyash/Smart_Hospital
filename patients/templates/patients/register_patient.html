{% extends "base.html" %}
{% block title %}Register Patient{% endblock %}
{% block content %}
<h2>Register Patient</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-group"><label>Name:</label>{{ form.name }}</div>
    <div class="form-group"><label>Age:</label>{{ form.age }}</div>
    <div class="form-group"><label>Gender:</label>{{ form.gender }}</div>
    <div class="form-group"><label>Contact:</label>{{ form.contact }}</div>
    <div class="form-group"><label>Address:</label>{{ form.address }}</div>
    <div class="form-group"><label>Medical History:</label>{{ form.medical_history }}</div>
    <button type="submit">Register</button>
</form>
{% endblock %}
